<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ceará">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

<title>Ceará Planejados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #0E0E1A; }
body { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ── CSS Variables ── */
:root {
  --bg:    #0E0E1A; --bg2: #131320; --s1: #16162A; --s2: #1A1A2E; --s3: #1E1E34; --s4: #22223A;
  --gold:  #C9A84C; --gold2: #EDD060; --gold3: rgba(212,175,55,0.12); --gold4: rgba(212,175,55,0.06);
  --grn:   #3A9E6A; --grn2: rgba(58,158,106,0.12);
  --tx:    #EDEAE0; --t2: #B8B4A8; --t3: #7A7880; --t4: #4E4C58;
  --red:   #E05555; --red2: rgba(224,85,85,0.12);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.4); --shadow-md: 0 4px 20px rgba(0,0,0,0.55); --shadow-lg: 0 8px 40px rgba(0,0,0,0.7);
  --border: 1px solid rgba(255,255,255,0.06); --border-g: 1px solid rgba(212,175,55,0.2);
  --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --r-xl: 26px;
}

/* ── Keyframes ── */
@keyframes fadeIn  { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{transform:translateY(18px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes scaleIn { from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1} }
@keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.4} }
@keyframes pageEnter { 0%{opacity:0;transform:translateY(10px) scale(.99)} 60%{opacity:1;transform:translateY(-2px) scale(1.001)} 100%{opacity:1;transform:translateY(0) scale(1)} }
@keyframes navIconPop { 0%{transform:scale(1) translateY(0)} 40%{transform:scale(1.25) translateY(-3px)} 70%{transform:scale(.95) translateY(1px)} 100%{transform:scale(1.12) translateY(0)} }
@keyframes springIn { 0%{transform:scale(.88);opacity:0} 55%{transform:scale(1.04);opacity:1} 80%{transform:scale(.98)} 100%{transform:scale(1);opacity:1} }
@keyframes shimmer { from{transform:translateX(-100%)} to{transform:translateX(100%)} }
@keyframes slideDown { from{transform:translateY(-10px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes modalUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
@keyframes toastIn { from{transform:translateX(-50%) translateY(20px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }

/* ── App Layout ── */
#sApp { display:flex; flex-direction:column; height:100%; background:var(--bg); position:relative; }
#hdrAndPages { flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; }

/* ── Header ── */
#hdr {
  display:flex; align-items:center; gap:12px; padding:12px 20px;
  background:rgba(14,14,26,0.85); backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid transparent; background-clip:padding-box;
  position:relative; z-index:50; flex-shrink:0;
}
#hdr::after { content:''; position:absolute; bottom:0;left:0;right:0; height:1px; background:linear-gradient(90deg,transparent 0%,rgba(212,175,55,0.3) 30%,rgba(212,175,55,0.5) 50%,rgba(212,175,55,0.3) 70%,transparent 100%); }
.hlogo { width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,#1E1E30,#14141F);border:1px solid rgba(212,175,55,0.35);display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 0 14px rgba(212,175,55,0.1),var(--shadow-sm);flex-shrink:0;cursor:pointer;transition:transform 160ms cubic-bezier(.34,1.56,.64,1); }
.hlogo:active { transform:scale(.9); }
.hnm { flex:1;font-size:.95rem;font-weight:700;color:var(--tx);letter-spacing:.01em;display:flex;flex-direction:column; }
.hsub { font-size:.62rem;font-weight:500;color:var(--t4);letter-spacing:.04em;margin-top:1px; }
.hdt { font-size:.72rem;font-weight:500;color:var(--t3);letter-spacing:.02em;flex-shrink:0; }

/* ── Pages ── */
#pages { flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none; }
#pages::-webkit-scrollbar { display:none; }
.pg { padding:20px 18px 0; animation:pageEnter 240ms cubic-bezier(.25,.46,.45,.94) both; will-change:opacity,transform; }

/* ── NavBar ── */
#nav {
  display:flex;align-items:stretch;
  background:rgba(14,14,26,0.92);backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  padding-bottom:env(safe-area-inset-bottom,0px);position:relative;z-index:100;flex-shrink:0;
}
#nav::before { content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(212,175,55,0.2) 20%,rgba(212,175,55,0.4) 50%,rgba(212,175,55,0.2) 80%,transparent 100%); }
.ni { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;border:none;background:transparent;cursor:pointer;position:relative;min-height:60px;outline:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation; }
.ni-ic-wrap { position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:32px;border-radius:16px;transition:background 200ms ease;margin-bottom:4px; }
.ni.on .ni-ic-wrap { background:rgba(212,175,55,0.14); }
.ni-i { font-size:1.25rem;display:block;transition:transform 200ms cubic-bezier(.34,1.56,.64,1);line-height:1; }
.ni.on .ni-i { transform:scale(1.18) translateY(-1px);animation:navIconPop 300ms cubic-bezier(.34,1.56,.64,1) both; }
.ni-l { font-size:.6rem;font-weight:500;color:var(--t4);letter-spacing:.02em;transition:color 160ms ease;line-height:1;white-space:nowrap; }
.ni.on .ni-l { color:var(--gold);font-weight:700; }
.ni.on::after { content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px rgba(212,175,55,0.6);animation:fadeIn 200ms ease both; }
.ni-cta .ni-ic-wrap { width:52px;height:36px;border-radius:18px;background:linear-gradient(145deg,#C9A84C,#A88030);box-shadow:0 2px 12px rgba(180,140,40,0.35); }
.ni-cta.on .ni-ic-wrap { background:linear-gradient(145deg,#EDD060,#C9A84C);box-shadow:0 4px 18px rgba(212,175,55,0.45); }
.ni-cta:active .ni-ic-wrap { transform:scale(.92); }
.ni-cta .ni-i { font-size:1.15rem; }
.ni-cta.on .ni-l { color:var(--gold2); }

/* ── Cards ── */
.card {
  background:var(--s2);border:var(--border);border-radius:var(--r-lg);
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow-sm);
  transition:transform 120ms ease,box-shadow 120ms ease;
  position:relative;overflow:hidden;
}
.card::before {
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);
  pointer-events:none;
}
.card:active { transform:scale(.99); }
.section { margin-bottom:20px; }
.section-ttl {
  font-size:.65rem;font-weight:700;color:var(--t4);
  letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:12px;padding-left:2px;
  display:flex;align-items:center;gap:8px;
}
.section-ttl::before {
  content:'';display:inline-block;
  width:14px;height:2px;
  background:linear-gradient(90deg,var(--gold),transparent);
  border-radius:2px;flex-shrink:0;
}
.hero { margin-bottom:22px; }
.hero-ttl { font-size:1.5rem;font-weight:800;color:var(--tx);letter-spacing:-.01em; }
.hero-sub { font-size:.78rem;color:var(--t3);margin-top:4px;font-weight:400; }

/* ── Buttons ── */
.btn { display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--r-sm);padding:11px 18px;font-size:.82rem;font-weight:700;font-family:var(--font);cursor:pointer;transition:transform 120ms cubic-bezier(.34,1.56,.64,1),opacity 120ms ease,box-shadow 120ms ease;-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none;font-family:'Outfit',sans-serif; }
.btn:active { transform:scale(.95);opacity:.9; }
.btn-gold  { background:linear-gradient(145deg,#C9A84C,#A88030);color:#0E0E1A;box-shadow:0 2px 10px rgba(180,140,40,.3); }
.btn-grn   { background:linear-gradient(145deg,#3A9E6A,#2E7D52);color:#fff;box-shadow:0 2px 10px rgba(58,158,106,.25); }
.btn-ghost { background:rgba(255,255,255,.06);color:var(--t2);border:var(--border); }
.btn-red   { background:linear-gradient(145deg,#E05555,#B83B3B);color:#fff; }
.btn-full  { width:100%; }
.btn-sm    { padding:8px 13px;font-size:.76rem;border-radius:8px; }

/* ── Quick Action Grid ── */
.qa-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
.qa-btn {
  display:flex;flex-direction:column;align-items:flex-start;gap:0;
  padding:16px 14px 14px;
  background:var(--s2);
  border:var(--border);
  border-radius:var(--r-lg);
  cursor:pointer;
  transition:transform 140ms cubic-bezier(.34,1.56,.64,1),background 120ms ease,border-color 130ms ease,box-shadow 120ms ease;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  animation:slideUp 160ms ease both;
  position:relative;overflow:hidden;
}
.qa-btn::after {
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.03) 0%,transparent 60%);
  pointer-events:none;
}
.qa-btn:active { transform:scale(.96);background:var(--s3);border-color:rgba(212,175,55,0.25);box-shadow:0 0 0 1px rgba(212,175,55,0.1); }
.qa-ic { font-size:1.55rem;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:10px; }
.qa-nm { font-size:.82rem;font-weight:700;color:var(--tx);line-height:1.25;letter-spacing:-.01em; }
.qa-sm { font-size:.63rem;font-weight:400;color:var(--t4);margin-top:3px;letter-spacing:.01em; }

/* ── Info items ── */
.info-item { display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,0.04); }
.info-item:last-child { border-bottom:none; }
.info-ic { font-size:1.25rem;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
.info-lbl { font-size:.66rem;font-weight:700;color:var(--t4);margin-bottom:2px;letter-spacing:.04em;text-transform:uppercase; }
.info-val { font-size:.8rem;font-weight:500;color:var(--t2);line-height:1.35; }
.info-body {}

/* ── Stat cards ── */
.stat-card { flex:1;background:rgba(0,0,0,0.25);border:1px solid rgba(212,175,55,0.12);border-radius:var(--r-md);padding:14px 8px 12px;text-align:center;position:relative;overflow:hidden; }
.stat-card::before { content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:40%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,0.35),transparent); }
.stat-val { font-size:1.4rem;font-weight:800;color:var(--gold2);line-height:1;margin-bottom:5px;letter-spacing:-.02em; }
.stat-lbl { font-size:.58rem;font-weight:600;color:var(--t4);letter-spacing:.06em;text-transform:uppercase; }

/* ── Home Banner ── */
.home-banner {
  border-radius:var(--r-xl);
  padding:22px 20px 0;
  margin-bottom:20px;
  background:
    radial-gradient(ellipse 80% 60% at 90% 10%, rgba(212,175,55,0.13) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 10% 90%, rgba(80,120,220,0.08) 0%, transparent 60%),
    linear-gradient(160deg,#1C1C2E 0%,#13131F 100%);
  border:1px solid rgba(212,175,55,0.18);
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(212,175,55,0.1);
  overflow:hidden;position:relative;
}
.home-banner::before {
  content:'';position:absolute;top:-60px;right:-50px;
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,0.1) 0%,transparent 65%);
  pointer-events:none;
}
.home-banner::after {
  content:'';position:absolute;bottom:-30px;left:-30px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(80,100,220,0.07) 0%,transparent 70%);
  pointer-events:none;
}
.home-banner-top { display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;position:relative;z-index:1; }
.home-banner-nm { font-size:1.28rem;font-weight:800;color:var(--tx);letter-spacing:-.02em;margin-bottom:3px; }
.home-banner-sub { font-size:.7rem;color:var(--t3);font-weight:400;letter-spacing:.03em; }
.home-stats { display:flex;gap:8px;padding:16px 0 20px;border-top:1px solid rgba(255,255,255,0.05);position:relative;z-index:1; }

/* ── Badges ── */
.badge { display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:.64rem;font-weight:700;background:rgba(255,255,255,.06);color:var(--t2);letter-spacing:.02em; }
.badge-grn  { background:var(--grn2);color:var(--grn); }
.badge-gold { background:var(--gold3);color:var(--gold); }
.badge-red  { background:var(--red2);color:var(--red); }

/* ── Tables ── */
.tbl { width:100%;border-collapse:collapse; }
.tbl th,.tbl td { padding:9px 4px;text-align:left;font-size:.76rem; }
.tbl th { color:var(--t4);font-weight:600;font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.05); }
.tbl td { color:var(--t2);border-bottom:1px solid rgba(255,255,255,.03); }
.tbl tr:last-child td { border-bottom:none; }
.tbl td:last-child,.tbl th:last-child { text-align:right;color:var(--gold);font-weight:700; }

/* ── Fields ── */
.divider { height:1px;background:rgba(255,255,255,.05);margin:12px 0; }
.field { margin-bottom:14px; }
.field label { display:block;font-size:.7rem;font-weight:600;color:var(--t3);margin-bottom:6px;letter-spacing:.03em; }
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],select,textarea {
  width:100%;background:var(--s3);border:1px solid rgba(255,255,255,0.08);border-radius:var(--r-sm);padding:12px 14px;font-family:'Outfit',sans-serif;font-size:.86rem;color:var(--tx);outline:none;appearance:none;-webkit-appearance:none;transition:border-color 150ms ease,box-shadow 150ms ease;
}
input:focus,select:focus,textarea:focus { border-color:rgba(212,175,55,0.4);box-shadow:0 0 0 3px rgba(212,175,55,0.08); }
::placeholder { color:var(--t4); }
input[type=date] { color-scheme:dark; }

/* ── Orçamento page ── */
.orc-tipos { display:flex;overflow-x:auto;gap:8px;padding-bottom:8px;margin-bottom:18px;scrollbar-width:none; }
.orc-tipos::-webkit-scrollbar { display:none; }
.orc-tipo-btn { flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 14px;background:var(--s2);border:var(--border);border-radius:var(--r-md);cursor:pointer;transition:background 130ms ease,border-color 130ms ease,transform 130ms ease;-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none; }
.orc-tipo-btn.active { background:var(--gold3);border-color:rgba(212,175,55,0.4); }
.orc-tipo-btn:active { transform:scale(.95); }
.orc-tipo-ic { font-size:1.4rem;line-height:1; }
.orc-tipo-lbl { font-size:.6rem;font-weight:600;color:var(--t3);letter-spacing:.02em;white-space:nowrap; }
.orc-tipo-btn.active .orc-tipo-lbl { color:var(--gold); }
.orc-result { background:linear-gradient(135deg,rgba(212,175,55,0.07),rgba(212,175,55,0.03));border:1px solid rgba(212,175,55,0.2);border-radius:var(--r-lg);padding:18px 16px;margin-bottom:14px;animation:scaleIn .18s ease both; }
.orc-total { font-size:2rem;font-weight:800;color:var(--gold2);letter-spacing:-.02em;line-height:1;margin-bottom:4px; }
.orc-avista { font-size:.72rem;color:var(--grn);font-weight:600;margin-bottom:14px; }
.orc-linhas { border-top:1px solid rgba(255,255,255,.05);padding-top:12px; }
.orc-linha { display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:.73rem;color:var(--t3);border-bottom:1px solid rgba(255,255,255,.03); }
.orc-linha:last-child { border-bottom:none; }
.orc-linha span:last-child { color:var(--t2);font-weight:600; }
.orc-cad { width:100%;border-radius:var(--r-md);background:rgba(0,0,0,.3);border:1px solid rgba(100,200,255,0.1);margin-bottom:14px;display:block; }
.orc-accs { display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px; }
.orc-acc-btn { display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--s2);border:var(--border);border-radius:20px;cursor:pointer;font-size:.7rem;font-weight:600;color:var(--t3);transition:background 120ms ease,border-color 120ms ease;-webkit-tap-highlight-color:transparent;outline:none; }
.orc-acc-btn.on { background:var(--gold3);border-color:rgba(212,175,55,0.35);color:var(--gold); }
.orc-acc-btn.obrig { opacity:.5;cursor:default; }
.orc-saved { display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r-md);background:rgba(58,158,106,0.1);border:1px solid rgba(58,158,106,0.25);font-size:.72rem;font-weight:600;color:var(--grn);animation:slideUp .22s ease both;margin-bottom:10px; }
.campo-row { display:flex;gap:10px; }
.campo-row .field { flex:1; }

/* ── Historico ── */
.hist-wrap { display:flex;flex-direction:column;height:100%;overflow:hidden; }
.hist-head { flex-shrink:0;padding:16px 16px 0; }
.hist-titulo { font-size:1rem;font-weight:700;color:var(--tx);margin-bottom:12px; }
.hist-filtros { display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px; }
.hist-filtros::-webkit-scrollbar { display:none; }
.hist-chip { flex-shrink:0;display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:50px;border:1px solid rgba(255,255,255,.08);background:var(--s2);font-size:.68rem;font-weight:600;color:var(--t3);cursor:pointer;transition:all .15s;white-space:nowrap;outline:none; }
.hist-chip.on { background:rgba(201,168,76,.12);border-color:rgba(201,168,76,.3);color:var(--gold); }
.hist-busca { position:relative;margin-bottom:10px; }
.hist-busca-ic { position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.85rem;pointer-events:none; }
.hist-busca input { width:100%;box-sizing:border-box;padding:10px 12px 10px 34px;background:var(--s2);border:1px solid rgba(255,255,255,.07);border-radius:10px;font-size:.78rem;color:var(--tx);outline:none;font-family:'Outfit',sans-serif; }
.hist-busca input:focus { border-color:rgba(201,168,76,.3);background:var(--s3); }
.hist-date-row { display:flex;gap:8px;margin-bottom:10px; }
.hist-date-group { flex:1;display:flex;flex-direction:column; }
.hist-date-lbl { font-size:.62rem;color:var(--t4);margin-bottom:3px; }
.hist-date-row input[type=date] { flex:1;padding:9px 10px;background:var(--s2);border:1px solid rgba(255,255,255,.07);border-radius:10px;font-size:.72rem;color:var(--tx);outline:none;font-family:'Outfit',sans-serif;color-scheme:dark; }
.hist-resumo { font-size:.64rem;color:var(--t4);padding:0 2px 8px; }
.hist-list { flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;scrollbar-width:none; }
.hist-list::-webkit-scrollbar { display:none; }
.hist-empty { display:flex;flex-direction:column;align-items:center;justify-content:center;height:160px;font-size:.76rem;color:var(--t4);text-align:center;line-height:1.8;gap:8px; }
.hist-empty-ic { font-size:2rem; }
.orc-card { background:var(--s2);border:1px solid rgba(255,255,255,.06);border-radius:14px;margin-bottom:10px;overflow:hidden;animation:fadeIn .2s ease both; }
.orc-card-top { display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer; }

// INDEXEDDB
// ════════════════════════════════════════════════════════════

const DB_NAME = 'CearPlanejados', DB_VERSION = 1;
let _dbPromise = null;

function getDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('orcamentos')) {
        const os = db.createObjectStore('orcamentos', { keyPath:'id', autoIncrement:true });
        os.createIndex('por_data',    'criadoEm',    { unique:false });
        os.createIndex('por_cliente', 'clienteNome', { unique:false });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
  return _dbPromise;
}

async function dbTx(store, mode, fn) {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const s  = tx.objectStore(store);
    const req = fn(s);
    if (req) { req.onsuccess = e => resolve(e.target.result); req.onerror = e => reject(e.target.error); }
    else { tx.oncomplete = () => resolve(); tx.onerror = e => reject(e.target.error); }
  });
}

async function salvarOrcamento(dados) {
  return dbTx('orcamentos','readwrite', s => s.add({ ...dados, criadoEm: new Date().toISOString() }));
}
async function listarOrcamentos() {
  const todos = await dbTx('orcamentos','readonly', s => s.getAll());
  return todos.sort((a,b) => new Date(b.criadoEm) - new Date(a.criadoEm));
}
async function removerOrcamento(id) {
  return dbTx('orcamentos','readwrite', s => s.delete(id));
}
async function atualizarOrcamento(orc) {
  return dbTx('orcamentos','readwrite', s => s.put({ ...orc, atualizadoEm: new Date().toISOString() }));
}
async function duplicarOrcamento(orc) {
  const { id, criadoEm, atualizadoEm, ...resto } = orc;
  return salvarOrcamento({ ...resto, clienteNome: orc.clienteNome ? orc.clienteNome + ' (cópia)' : '' });
}

function formatBRL(v) {
  return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits:2 });
}

function calcularOrcamento({ tipo, larg, alt, vidro, accs, km }) {
  if (!larg || !alt || isNaN(larg) || isNaN(alt)) return null;
  const linhas = []; let total = 0, descontoBase = 0;
  const area = (larg/100)*(alt/100);
  const vidroObj = VIDROS[vidro];
  if (vidroObj) {
    const val = area * vidroObj.preco;
    linhas.push({ nome:vidroObj.nome, valor:val });
    total += val;
    if (vidroObj.temperado) descontoBase += val * DESCONTO_AVISTA;
  }
  (ACESSORIOS_CONFIG[tipo] || []).forEach(a => {
    const ativo = accs[a.id] ?? a.obrig;
    if (!ativo) return;
    let val = 0;
    if (a.preco !== null && a.preco !== undefined) { val = a.preco; }
    else {
      if (tipo === 'correr')  val = area * 100;
      if (tipo === 'janela')  val = (larg/100) * 100;
      if (tipo === 'box')     val = area * 120;
      if (tipo === 'espelho' && a.id === 'botoes') val = larg >= 60 ? 4*15 : 0;
      if (tipo === 'comum'   && a.id === 'recorte') val = area * 10;
    }
    linhas.push({ nome:a.nome, valor:val });
    total += val;
  });
  const kmNum = parseFloat(km) || 0;
  let frete = 0;
  if (kmNum > FRETE_GRATIS_KM) frete = (kmNum - FRETE_GRATIS_KM) * FRETE_POR_KM_EXTRA;
  linhas.push({ nome:`Frete (${kmNum} km)`, valor:frete });
  total += frete;
  return { linhas, total, totalAvista: total - descontoBase };
}

function gerarTextoWpp({ cliente, tipo, larg, alt, vidro, resultado }) {
  if (!resultado) return '';
  const vidroObj = VIDROS[vidro];
  const dataStr = new Date().toLocaleDateString('pt-BR');
  let txt = `*Orçamento — Ceará Planejados*\n📅 ${dataStr}\n`;
  if (cliente) txt += `👤 Cliente: ${cliente}\n`;
  txt += `\n📦 Produto: *${TIPO_LABEL[tipo]||tipo}*\n📐 Medidas: ${larg} x ${alt} cm\n`;
  if (vidroObj) txt += `🔷 Vidro: ${vidroObj.nome}\n`;
  txt += `\n*Composição:*\n`;
  resultado.linhas.forEach(l => txt += `• ${l.nome}: ${formatBRL(l.valor)}\n`);
  txt += `\n💰 *Total: ${formatBRL(resultado.total)}*\n💚 À vista (10% off): *${formatBRL(resultado.totalAvista)}*\n\n_Orçamento gerado pelo app Ceará Planejados_`;
  return txt;
}

function formatData(iso) {

function renderCAD(svgEl, { tipo, larg, alt }) {
  if (!svgEl || !larg || !alt || isNaN(larg) || isNaN(alt)) return;
  while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
  const W=320,H=200,MARGIN=30,maxPW=W-MARGIN*2-40,maxPH=H-MARGIN*2-30;
  const scale=Math.min(maxPW/larg,maxPH/alt), pw=larg*scale, ph=alt*scale;
  const ox=(W-pw)/2-10, oy=(H-ph)/2-5;
  const C = { glass:'rgba(100,200,255,0.12)',frame:'rgba(100,200,255,0.55)',dim:'rgba(100,180,255,0.4)',dimArrow:'rgba(100,200,255,0.7)',label:'rgba(150,220,255,0.9)' };
  const ns = 'http://www.w3.org/2000/svg';
  function el(tag,attrs) { const e=document.createElementNS(ns,tag); Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v)); return e; }
  function rect(x,y,w,h,attrs) { return el('rect',{x,y,width:w,height:h,...attrs}); }
  function line(x1,y1,x2,y2,attrs) { return el('line',{x1,y1,x2,y2,...attrs}); }
  function txt(x,y,text,attrs) { const e=el('text',{x,y,...attrs}); e.textContent=text; return e; }
  function path(d,attrs) { return el('path',{d,...attrs}); }
  const defs=el('defs',{});
  const mkArr=(id,d)=>{ const m=el('marker',{id,markerWidth:6,markerHeight:6,refX:3,refY:3,orient:'auto'}); m.appendChild(el('path',{d,fill:C.dimArrow})); return m; };
  defs.appendChild(mkArr('arr','M0,1 L6,3 L0,5 Z')); defs.appendChild(mkArr('arrR','M6,1 L0,3 L6,5 Z'));
  const gId='gG'; const lg=el('linearGradient',{id:gId,x1:'0',y1:'0',x2:'1',y2:'1'});
  lg.appendChild(el('stop',{offset:'0%','stop-color':'rgba(255,255,255,0.12)'}));
  lg.appendChild(el('stop',{offset:'50%','stop-color':'rgba(255,255,255,0.03)'}));
  lg.appendChild(el('stop',{offset:'100%','stop-color':'rgba(100,200,255,0.06)'}));
  defs.appendChild(lg); svgEl.appendChild(defs);
  svgEl.appendChild(rect(ox,oy,pw,ph,{fill:C.glass,rx:'3'}));
  svgEl.appendChild(rect(ox,oy,pw,ph,{fill:`url(#${gId})`,rx:'3'}));
  svgEl.appendChild(rect(ox,oy,pw,ph,{fill:'none',stroke:C.frame,'stroke-width':'2',rx:'3'}));
  if (tipo==='pivotante') {
    const pvX=ox+pw*0.12;
    svgEl.appendChild(line(pvX,oy+4,pvX,oy+ph-4,{stroke:'rgba(255,200,80,0.5)','stroke-width':'2'}));
    svgEl.appendChild(line(pvX,oy+ph*0.5,ox+pw-8,oy+8,{stroke:'rgba(100,200,255,0.25)','stroke-width':'1','stroke-dasharray':'4,3'}));
    svgEl.appendChild(el('circle',{cx:pvX,cy:oy+ph*0.5,r:'4',fill:'none',stroke:'rgba(255,200,80,0.6)','stroke-width':'1.5'}));
  } else if (tipo==='correr') {
    const folhas=larg>200?4:2;
    for(let f=1;f<folhas;f++){const fx=ox+pw*(f/folhas);svgEl.appendChild(line(fx,oy+2,fx,oy+ph-2,{stroke:'rgba(100,200,255,0.5)','stroke-width':'1.5','stroke-dasharray':'2,2'}));}
    svgEl.appendChild(path(`M${ox+6},${oy+ph/2} L${ox+14},${oy+ph/2-4} L${ox+14},${oy+ph/2+4} Z`,{fill:'rgba(100,200,255,0.4)'}));
  } else if (tipo==='janela') {
    svgEl.appendChild(line(ox+2,oy+ph/2,ox+pw-2,oy+ph/2,{stroke:'rgba(100,200,255,0.45)','stroke-width':'1.2','stroke-dasharray':'2,2'}));
    const fj=larg<=120?2:4; for(let f=1;f<fj;f++){const fjx=ox+pw*(f/fj);svgEl.appendChild(line(fjx,oy+2,fjx,oy+ph-2,{stroke:'rgba(100,200,255,0.45)','stroke-width':'1','stroke-dasharray':'2,2'}));}
  } else if (tipo==='espelho') {
    svgEl.appendChild(line(ox+pw*0.3,oy+4,ox+pw*0.15,oy+ph-4,{stroke:'rgba(255,255,255,0.14)','stroke-width':'2','stroke-linecap':'round'}));
  } else if (tipo==='guarda') {
    const mods=Math.ceil((larg/100)/1.2);
    for(let m=0;m<=mods;m++){let gx=Math.min(ox+(pw/mods)*m,ox+pw-2);svgEl.appendChild(line(gx,oy+2,gx,oy+ph-2,{stroke:'rgba(100,200,255,0.5)','stroke-width':'2'}));}
    svgEl.appendChild(line(ox+2,oy+8,ox+pw-2,oy+8,{stroke:'rgba(100,200,255,0.55)','stroke-width':'2'}));
  } else {
    svgEl.appendChild(line(ox+2,oy+2,ox+pw-2,oy+ph-2,{stroke:'rgba(100,200,255,0.12)','stroke-width':'1'}));
    svgEl.appendChild(line(ox+pw-2,oy+2,ox+2,oy+ph-2,{stroke:'rgba(100,200,255,0.12)','stroke-width':'1'}));
  }
  const cm=8,cmS='rgba(100,200,255,0.4)',cmW='1.2';
  [[ox,oy,1,1],[ox+pw,oy,-1,1],[ox,oy+ph,1,-1],[ox+pw,oy+ph,-1,-1]].forEach(([x,y,dx,dy])=>{
    svgEl.appendChild(line(x,y,x+cm*dx,y,{stroke:cmS,'stroke-width':cmW}));
    svgEl.appendChild(line(x,y,x,y+cm*dy,{stroke:cmS,'stroke-width':cmW}));
  });
  const DIMGAP=10,DIMOFF=6,dy=oy+ph+DIMGAP+DIMOFF;
  svgEl.appendChild(line(ox,oy+ph+DIMOFF,ox,dy+2,{stroke:C.dim,'stroke-width':'0.8'}));
  svgEl.appendChild(line(ox+pw,oy+ph+DIMOFF,ox+pw,dy+2,{stroke:C.dim,'stroke-width':'0.8'}));
  svgEl.appendChild(line(ox,dy,ox+pw,dy,{stroke:C.dimArrow,'stroke-width':'1.2','marker-start':'url(#arrR)','marker-end':'url(#arr)'}));
  svgEl.appendChild(txt(ox+pw/2,dy+8,`${larg} cm`,{'text-anchor':'middle','font-size':'9','font-family':'Outfit,sans-serif','font-weight':'700',fill:C.label}));
  const dx2=ox+pw+DIMGAP+DIMOFF;
  svgEl.appendChild(line(ox+pw+DIMOFF,oy,dx2+2,oy,{stroke:C.dim,'stroke-width':'0.8'}));
  svgEl.appendChild(line(ox+pw+DIMOFF,oy+ph,dx2+2,oy+ph,{stroke:C.dim,'stroke-width':'0.8'}));
  svgEl.appendChild(line(dx2,oy,dx2,oy+ph,{stroke:C.dimArrow,'stroke-width':'1.2','marker-start':'url(#arrR)','marker-end':'url(#arr)'}));
  svgEl.appendChild(txt(dx2+9,oy+ph/2,`${alt} cm`,{'text-anchor':'middle','font-size':'9','font-family':'Outfit,sans-serif','font-weight':'700',fill:C.label,transform:`rotate(-90,${dx2+9},${oy+ph/2})`}));
  if (pw>70&&ph>40) { const area=(larg/100)*(alt/100); svgEl.appendChild(txt(ox+pw/2,oy+ph/2+3,`${area.toFixed(2)} m²`,{'text-anchor':'middle','font-size':'8','font-family':'Outfit,sans-serif',fill:'rgba(150,220,255,0.6)'})); }
}

function renderOrc(wrap) {
  const s = orcState;
  const accConfig = ACESSORIOS_CONFIG[s.tipo] || [];
  const vidrosDispo = (VIDROS_POR_TIPO[s.tipo]||[]).map(k=>({key:k,...VIDROS[k]}));
  const res = s.resultado;

  wrap.innerHTML = `
    <div id="pgOrcamento">
      <div class="orc-tipos" id="orcTipos">
        ${TIPOS.map(t=>`
          <button class="orc-tipo-btn${s.tipo===t.id?' active':''}" onclick="orcTrocaTipo('${t.id}')">
            <span class="orc-tipo-ic">${t.icon}</span>
            <span class="orc-tipo-lbl">${t.label}</span>
          </button>
        `).join('')}
      </div>

      <svg id="orcCAD" class="orc-cad" viewBox="0 0 320 200"></svg>

      <div class="campo-row">
        <div class="field"><label>Largura (cm)</label><input id="orcLarg" type="number" inputmode="numeric" value="${s.larg}" placeholder="cm" oninput="orcUpdate()"></div>
        <div class="field"><label>Altura (cm)</label><input id="orcAlt" type="number" inputmode="numeric" value="${s.alt}" placeholder="cm" oninput="orcUpdate()"></div>
      </div>

      <div class="field">
        <label>Tipo de vidro</label>
        <select id="orcVidro" onchange="orcUpdate()">
          ${vidrosDispo.map(v=>`<option value="${v.key}"${s.vidroKey===v.key?' selected':''}>${v.nome} — ${formatBRL(v.preco)}/m²</option>`).join('')}
        </select>
      </div>

      ${accConfig.length>0?`
        <div class="section" style="margin-bottom:16px">
          <div class="section-ttl">Acessórios</div>
          <div class="orc-accs" id="orcAccs">
            ${accConfig.map(a=>{
              const ativo = s.accs[a.id]??a.obrig;
              return `<button class="orc-acc-btn${ativo?' on':''}${a.obrig?' obrig':''}" onclick="orcToggleAcc('${a.id}',${a.obrig})">${ativo?'✓':'+'} ${a.nome}${a.preco?` (${formatBRL(a.preco)})`:a.desc?` (${a.desc})`:''}</button>`;
            }).join('')}
          </div>
        </div>
      `:''}

      <div class="field">
        <label>Distância (km) — frete grátis até 20 km</label>
        <input id="orcKm" type="number" inputmode="numeric" value="${s.km}" placeholder="0" oninput="orcUpdate()">
      </div>

      <div class="campo-row">
        <div class="field"><label>Cliente (opcional)</label><input id="orcCliente" type="text" value="${s.cliente}" placeholder="Nome" oninput="orcUpdate()"></div>
        <div class="field"><label>Telefone</label><input id="orcFone" type="tel" value="${s.fone}" placeholder="(85) 9..." oninput="orcUpdate()"></div>
      </div>

      <div id="orcResultBox"></div>
      <div id="orcSavedMsg"></div>
      <div id="orcAcoes"></div>
      <div style="height:88px"></div>
    </div>
  `;

  renderCAD(document.getElementById('orcCAD'), { tipo:s.tipo, larg:s.larg, alt:s.alt });
  orcCalcAndRender();
}

function orcUpdate() {
  const larg = parseFloat(document.getElementById('orcLarg')?.value)||0;
  const alt  = parseFloat(document.getElementById('orcAlt')?.value)||0;
  const vidro= document.getElementById('orcVidro')?.value||orcState.vidroKey;
  const km   = parseFloat(document.getElementById('orcKm')?.value)||0;
  const cliente = document.getElementById('orcCliente')?.value||'';
  const fone    = document.getElementById('orcFone')?.value||'';
  orcState.larg = larg; orcState.alt = alt; orcState.vidroKey = vidro;
  orcState.km = km; orcState.cliente = cliente; orcState.fone = fone;
  renderCAD(document.getElementById('orcCAD'), { tipo:orcState.tipo, larg, alt });
  orcCalcAndRender();
}

function orcCalcAndRender() {
  const s = orcState;
  const res = calcularOrcamento({ tipo:s.tipo, larg:s.larg, alt:s.alt, vidro:s.vidroKey, accs:s.accs, km:s.km });
  orcState.resultado = res;
  const rb = document.getElementById('orcResultBox');
  const ra = document.getElementById('orcAcoes');
  if (!rb) return;
  if (res) {
    rb.innerHTML = `
      <div class="orc-result">
        <div class="orc-total">${formatBRL(res.total)}</div>
        ${res.totalAvista < res.total ? `<div class="orc-avista">💚 À vista: ${formatBRL(res.totalAvista)} (10% off)</div>` : ''}
        <div class="orc-linhas">
          ${res.linhas.map(l=>`<div class="orc-linha"><span>${l.nome}</span><span>${formatBRL(l.valor)}</span></div>`).join('')}
        </div>
      </div>
    `;
    ra.innerHTML = `
      <div style="display:flex;gap:10px;margin-bottom:12px">
        <button class="btn btn-ghost btn-full" onclick="orcSalvar()">💾 Salvar</button>
        <button class="btn btn-grn btn-full" onclick="orcWpp()">📲 WhatsApp</button>
      </div>
    `;
  } else {
    rb.innerHTML = '';
    ra.innerHTML = '';
  }
}

function orcTrocaTipo(tipo) {
  orcState.tipo = tipo;
  orcState.larg = DEFAULTS[tipo]?.larg ?? 80;
  orcState.alt  = DEFAULTS[tipo]?.alt ?? 120;
  orcState.vidroKey = (VIDROS_POR_TIPO[tipo]||[])[0]||'';
  orcState.accs = {};
  orcState.resultado = null;
  renderOrc(document.getElementById('pgWrap'));
}

function orcToggleAcc(id, obrig) {
  if (obrig) return;
  orcState.accs[id] = !(orcState.accs[id] ?? false);
  orcCalcAndRender();
  // Update acc buttons
  const accConfig = ACESSORIOS_CONFIG[orcState.tipo] || [];
  const container = document.getElementById('orcAccs');
  if (container) {
    container.innerHTML = accConfig.map(a=>{
      const ativo = orcState.accs[a.id]??a.obrig;
      return `<button class="orc-acc-btn${ativo?' on':''}${a.obrig?' obrig':''}" onclick="orcToggleAcc('${a.id}',${a.obrig})">${ativo?'✓':'+'} ${a.nome}${a.preco?` (${formatBRL(a.preco)})`:a.desc?` (${a.desc})`:''}</button>`;
    }).join('');
  }
}

async function orcSalvar() {
  if (!orcState.resultado) return;
  showModalConfirm(
    '💾 Salvar orçamento?',
    `Salvar orçamento de ${formatBRL(orcState.resultado.total)} no histórico${orcState.cliente ? ` para ${orcState.cliente}` : ''}?`,
    'Salvar',
    async () => {
      try {
        await salvarOrcamento({
          tipo: orcState.tipo,
          larg: orcState.larg,
          alt:  orcState.alt,
          vidro: orcState.vidroKey,
          accs: orcState.accs,
          km: orcState.km,
          clienteNome: orcState.cliente.trim(),
          clienteFone: orcState.fone.trim(),
          resultado: orcState.resultado,
        });
        closeModal();
        const sm = document.getElementById('orcSavedMsg');
        if (sm) { sm.innerHTML = '<div class="orc-saved">✓ Orçamento salvo no histórico!</div>'; setTimeout(()=>sm.innerHTML='',3000); }
      } catch(e) { alert('Erro ao salvar: '+e.message); }
    }
  );
}

function orcWpp() {
  if (!orcState.resultado) return;
  const txt = gerarTextoWpp({ cliente:orcState.cliente, tipo:orcState.tipo, larg:orcState.larg, alt:orcState.alt, vidro:orcState.vidroKey, resultado:orcState.resultado });
  showModalWpp(txt, () => {
    const num = orcState.fone.replace(/\D/g,'');
    const base = num ? `https://wa.me/55${num}` : 'https://wa.me/';
    window.open(`${base}?text=${encodeURIComponent(txt)}`, '_blank');
    closeModal();
  });
}

let histState = { filtro:'todos', busca:'', dataInicio:'', dataFim:'', orcamentos:[], expandido:null };

function renderHistorico(wrap) {
  wrap.style.padding = '0';
  wrap.innerHTML = `
    <div class="hist-wrap" id="histWrap">
      <div class="hist-head">
        <div class="hist-titulo">📂 Histórico</div>
        <div class="hist-filtros" id="histFiltros">
          ${[['todos','📋 Todos'],['cliente','👤 Cliente'],['telefone','📱 Telefone'],['data','📅 Data']].map(([id,lbl])=>`
            <button class="hist-chip${histState.filtro===id?' on':''}" onclick="histSetFiltro('${id}')">${lbl}</button>
          `).join('')}
        </div>
        <div id="histBuscaWrap">
          ${histState.filtro!=='data'?`
            <div class="hist-busca">
              <span class="hist-busca-ic">🔍</span>
              <input id="histBuscaInput" value="${histState.busca}" placeholder="${histPlaceholder()}" oninput="histSetBusca(this.value)" autocomplete="off">
            </div>
          `:`
            <div class="hist-date-row">
              <div class="hist-date-group"><div class="hist-date-lbl">De</div><input type="date" id="histDataIni" value="${histState.dataInicio}" onchange="histSetDatas(this.value,null)"></div>
              <div class="hist-date-group"><div class="hist-date-lbl">Até</div><input type="date" id="histDataFim" value="${histState.dataFim}" onchange="histSetDatas(null,this.value)"></div>
            </div>
          `}
        </div>
        <div class="hist-resumo" id="histResumo">Carregando…</div>
      </div>
      <div class="hist-list" id="histList"><div class="hist-empty"><div class="hist-empty-ic">⏳</div>Carregando…</div></div>
      <div id="histToast"></div>
    </div>
  `;
  histCarregar();
}

function histPlaceholder() {
  return { todos:'Buscar por cliente, telefone ou tipo…', cliente:'Digite o nome do cliente…', telefone:'Digite o telefone…', data:'' }[histState.filtro]||'Buscar…';
}

async function histCarregar() {
  try {
    histState.orcamentos = await listarOrcamentos();
    histRenderLista();
  } catch(e) {
    const l = document.getElementById('histList');
    if (l) l.innerHTML = '<div class="hist-empty"><div class="hist-empty-ic">❌</div>Erro ao carregar</div>';
  }
}

function histFiltrar() {
  let lista = [...histState.orcamentos];
  const t = histState.busca.trim().toLowerCase();
  if (histState.filtro==='cliente' && t) {
    lista = lista.filter(o => (o.clienteNome||'').toLowerCase().includes(t));
  } else if (histState.filtro==='telefone' && t) {
    const d = histState.busca.replace(/\D/g,'');
    lista = lista.filter(o => (o.clienteFone||'').replace(/\D/g,'').includes(d)||(o.clienteFone||'').toLowerCase().includes(t));
  } else if (histState.filtro==='data') {
    if (histState.dataInicio) lista = lista.filter(o => o.criadoEm >= histState.dataInicio);
    if (histState.dataFim)    lista = lista.filter(o => o.criadoEm <= histState.dataFim+'T23:59:59');
  } else if (t) {
    lista = lista.filter(o => (o.clienteNome||'').toLowerCase().includes(t)||(o.clienteFone||'').toLowerCase().includes(t)||((TIPO_LABEL[o.tipo]||'').toLowerCase().includes(t)));
  }
  return lista;
}

function histRenderLista() {
  const lista = histFiltrar();
  const resumo = document.getElementById('histResumo');
  const listEl = document.getElementById('histList');
  if (!listEl) return;
  if (resumo) resumo.textContent = `${lista.length} orçamento${lista.length!==1?'s':''}${histState.orcamentos.length!==lista.length?` de ${histState.orcamentos.length}`:''}`;
  if (lista.length===0) {
    listEl.innerHTML = `<div class="hist-empty"><div class="hist-empty-ic">${histState.orcamentos.length===0?'📭':'🔍'}</div>${histState.orcamentos.length===0?'Nenhum orçamento salvo ainda.\nFaça seu primeiro orçamento!':'Nenhum resultado para esta busca.'}</div>`;
    return;
  }
  listEl.innerHTML = lista.map(orc => histRenderCard(orc)).join('');
}

function histRenderCard(orc) {
  const c = corTipo(orc.tipo);
  const expanded = histState.expandido === orc.id;
  return `
    <div class="orc-card" id="orcCard${orc.id}">
      <div class="orc-card-top" onclick="histToggleExpand(${orc.id})">
        <div class="orc-card-ic" style="background:${c.bg};border:1px solid ${c.brd}">${TIPO_ICON[orc.tipo]||'📋'}</div>
        <div class="orc-card-info">
          <div class="orc-card-titulo">${TIPO_LABEL[orc.tipo]||orc.tipo}${orc.clienteNome?` · ${orc.clienteNome}`:''}</div>
          <div class="orc-card-sub">${orc.larg}×${orc.alt}cm${orc.vidro&&VIDROS[orc.vidro]?' · '+VIDROS[orc.vidro].nome:''}</div>
        </div>
        <div class="orc-card-total">
          <div class="orc-card-valor">${orc.resultado?formatBRL(orc.resultado.total):'—'}</div>
          <div class="orc-card-data">${formatData(orc.criadoEm)}</div>
        </div>
      </div>
      ${expanded?`
        <div class="orc-card-expand">
          <div class="orc-card-detail">
            ${(orc.resultado?.linhas||[]).map(l=>`<div class="orc-detail-row"><span>${l.nome}</span><span>${formatBRL(l.valor)}</span></div>`).join('')}
            ${orc.resultado?.totalAvista<orc.resultado?.total?`<div class="orc-detail-row" style="margin-top:4px"><span style="color:var(--grn)">💚 À vista</span><span style="color:var(--grn)">${formatBRL(orc.resultado.totalAvista)}</span></div>`:''}
            ${orc.clienteFone?`<div class="orc-detail-row"><span>📱 Telefone</span><span>${orc.clienteFone}</span></div>`:''}
          </div>
          <div class="orc-card-actions">
            <button class="orc-act-btn orc-act-editar" onclick="histEditar(${orc.id})">✏️ Editar</button>
            <button class="orc-act-btn orc-act-dupl"   onclick="histDuplicar(${orc.id})">📋 Duplicar</button>
            <button class="orc-act-btn orc-act-excluir" onclick="histExcluir(${orc.id})">🗑️ Excluir</button>
          </div>
        </div>
      `:''}
    </div>
  `;
}

function histToggleExpand(id) {
  histState.expandido = histState.expandido===id ? null : id;
  histRenderLista();
}

function histSetFiltro(id) {
  histState.filtro = id; histState.busca=''; histState.dataInicio=''; histState.dataFim='';
  const fw = document.getElementById('histFiltros');
  if (fw) fw.querySelectorAll('.hist-chip').forEach(b=>{ b.classList.toggle('on', b.textContent.trim()===(['todos','cliente','telefone','data'].map((x,i)=>['📋 Todos','👤 Cliente','📱 Telefone','📅 Data'][i])[['todos','cliente','telefone','data'].indexOf(id)])); });
  // Re-render search area
  const bw = document.getElementById('histBuscaWrap');
  if (bw) bw.innerHTML = histState.filtro!=='data'?`<div class="hist-busca"><span class="hist-busca-ic">🔍</span><input id="histBuscaInput" value="" placeholder="${histPlaceholder()}" oninput="histSetBusca(this.value)" autocomplete="off"></div>`:`<div class="hist-date-row"><div class="hist-date-group"><div class="hist-date-lbl">De</div><input type="date" id="histDataIni" onchange="histSetDatas(this.value,null)"></div><div class="hist-date-group"><div class="hist-date-lbl">Até</div><input type="date" id="histDataFim" onchange="histSetDatas(null,this.value)"></div></div>`;
  // Update chip styles
  document.querySelectorAll('.hist-chip').forEach((b,i)=>b.classList.toggle('on',i===['todos','cliente','telefone','data'].indexOf(id)));
  histRenderLista();
}

function histSetBusca(v) { histState.busca=v; histRenderLista(); }
function histSetDatas(ini,fim) {
  if (ini!==null) histState.dataInicio=ini;
  if (fim!==null) histState.dataFim=fim;
  histRenderLista();
}

function histMostrarToast(msg) {
  const t = document.getElementById('histToast');
  if (!t) return;
  t.innerHTML = `<div class="hist-toast">${msg}</div>`;
  setTimeout(()=>{ if(t) t.innerHTML=''; },2500);
}

async function histExcluir(id) {
  const orc = histState.orcamentos.find(o=>o.id===id);
  if (!orc) return;
  showModalConfirm('🗑️ Excluir orçamento?',`Deseja excluir o orçamento de ${orc.clienteNome||TIPO_LABEL[orc.tipo]}? Esta ação não pode ser desfeita.`,'Excluir',async()=>{
    try {
      await removerOrcamento(id);
      histState.orcamentos = histState.orcamentos.filter(o=>o.id!==id);
      histState.expandido=null;
      histRenderLista();
      closeModal();
      histMostrarToast('🗑️ Orçamento excluído');
    } catch(e) { histMostrarToast('❌ Erro ao excluir'); }
  }, true);
}

async function histDuplicar(id) {
  const orc = histState.orcamentos.find(o=>o.id===id);
  if (!orc) return;
  try {
    await duplicarOrcamento(orc);
    histState.orcamentos = await listarOrcamentos();
    histRenderLista();
    histMostrarToast('📋 Orçamento duplicado!');
  } catch(e) { histMostrarToast('❌ Erro ao duplicar'); }
}

function histEditar(id) {
  const orc = histState.orcamentos.find(o=>o.id===id);
  if (!orc) return;
  showModalEditar(orc, async(atualizado)=>{
    try {
      await atualizarOrcamento(atualizado);
      const idx = histState.orcamentos.findIndex(o=>o.id===id);
      if (idx>=0) histState.orcamentos[idx] = atualizado;
      histRenderLista();
      closeModal();
      histMostrarToast('✅ Orçamento atualizado!');
    } catch(e) { histMostrarToast('❌ Erro ao salvar'); }
  });
}

}

      to   { transform: translateY(-12px) scale(1.2); opacity: calc(var(--op,0.3)*1.8); }
    }
    #splashInner {
      display: flex; flex-direction: column; align-items: center;
      gap: 10px; padding: 0 40px; position: relative; z-index: 1;
      animation: splashIn 560ms cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes splashIn {
      from { opacity: 0; transform: scale(.78) translateY(24px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes splashOut {
      from { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
      to   { opacity: 0; transform: scale(1.08) translateY(-8px); filter: blur(4px); }
    }
    #splashLogoWrap {
      position: relative; width: 88px; height: 88px;
      margin-bottom: 10px;
    }
    #splashLogo {
      width: 88px; height: 88px;
      border-radius: 24px;
      background: linear-gradient(145deg, #1E1E32, #12121E);
      border: 1px solid rgba(212,175,55,0.45);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem; position: relative; overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(212,175,55,0.1),
        0 0 40px rgba(212,175,55,0.18),
        0 12px 48px rgba(0,0,0,0.8);
      animation: splashBloom 2.4s ease-in-out infinite alternate;
    }
    @keyframes splashBloom {
      from {
        box-shadow: 0 0 0 1px rgba(212,175,55,0.1), 0 0 24px rgba(212,175,55,0.12), 0 12px 48px rgba(0,0,0,0.8);
      }
      to {
        box-shadow: 0 0 0 1px rgba(212,175,55,0.25), 0 0 52px rgba(212,175,55,0.32), 0 0 80px rgba(212,175,55,0.10), 0 12px 48px rgba(0,0,0,0.8);
      }
    }
    #splashLogoShimmer {
      position: absolute; inset: 0; border-radius: 24px;
      background: linear-gradient(105deg, transparent 30%, rgba(237,208,96,0.22) 50%, transparent 70%);
      background-size: 200% 100%;
      animation: splashShimmer 2s ease-in-out infinite;
      pointer-events: none;
    }
    #splashNome {
      font-family: 'Outfit', sans-serif;
      font-size: 1.45rem; font-weight: 800;
      color: #EDEAE0; letter-spacing: -.015em;
      background: linear-gradient(135deg, #EDD060 0%, #C9A84C 50%, #EDD060 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: splashShimmer 3s ease-in-out infinite;
    }
    #splashSub {
      font-family: 'Outfit', sans-serif;
      font-size: .72rem; font-weight: 400;
      color: #6A6870; letter-spacing: .05em;
    }
    #splashBar {
      width: 130px; height: 3px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      margin-top: 32px;
      overflow: hidden;
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
    }
    #splashBarFill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #A88030, #EDD060, #C9A84C);
      border-radius: 10px;
      transition: width 1.5s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 0 8px rgba(237,208,96,0.5);
    }
  `;
  document.head.appendChild(style);
  document.body.appendChild(splash);

  // Gera partículas douradas decorativas
  const particles = splash.querySelector('#splashParticles');
  const dots = [
    { x:15, y:20, s:3, op:0.3, dur:'2.8s', delay:'0s' },
    { x:82, y:15, s:2, op:0.25, dur:'3.2s', delay:'.4s' },
    { x:90, y:70, s:4, op:0.2, dur:'2.5s', delay:'.8s' },
    { x:8,  y:75, s:2, op:0.3, dur:'3.5s', delay:'.2s' },
    { x:50, y:88, s:3, op:0.2, dur:'2.9s', delay:'1s' },
    { x:70, y:30, s:2, op:0.15, dur:'3.8s', delay:'.6s' },
    { x:25, y:60, s:2, op:0.2, dur:'4s', delay:'1.2s' },
  ];
  dots.forEach(d => {
    const el = document.createElement('div');
    el.className = 'sp-dot';
    el.style.cssText = `left:${d.x}%;top:${d.y}%;width:${d.s}px;height:${d.s}px;--op:${d.op};--dur:${d.dur};animation-delay:${d.delay};`;
    particles.appendChild(el);
  });

  // Animação da barra de progresso
  requestAnimationFrame(() => {
    setTimeout(() => {
      document.getElementById('splashBarFill').style.width = '100%';
    }, 80);
  });

  // Sair após 1.9s
  setTimeout(() => {
    splash.style.animation = 'splashOut 420ms cubic-bezier(.4,0,1,1) both';
    setTimeout(() => {
      splash.remove();
      style.remove();
      const sApp2 = document.getElementById('sApp');
      if (sApp2) sApp2.style.display = '';
      onDone();
    }, 400);
  }, 1900);
}

// ════════════════════════════════════════════════════════════
// PWA INSTALL PROMPT
// ════════════════════════════════════════════════════════════

let _pwaPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  _pwaPrompt = e;
  const banner = document.getElementById('pwaInstallBanner');
  if (banner) banner.classList.add('show');
});

window.addEventListener('appinstalled', () => {
  const banner = document.getElementById('pwaInstallBanner');
  if (banner) banner.classList.remove('show');
  _pwaPrompt = null;
});

function setupPWAButtons() {
  const installBtn = document.getElementById('pwaInstallBtn');
  const closeBtn   = document.getElementById('pwaInstallClose');
  const banner     = document.getElementById('pwaInstallBanner');
  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (!_pwaPrompt) return;
      _pwaPrompt.prompt();
      const { outcome } = await _pwaPrompt.userChoice;
      if (outcome === 'accepted') {
        banner.classList.remove('show');
        _pwaPrompt = null;
      }
    });
  }
  if (closeBtn && banner) {
    closeBtn.addEventListener('click', () => {
      banner.classList.remove('show');
    });
  }
}

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════

function initApp() {
  try {
    // Header date
    function getDataHdr() {
      const d = new Date();
      const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
      return `${dias[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
    }
    const hdrDataEl = document.getElementById('hdrData');
    if (hdrDataEl) hdrDataEl.textContent = getDataHdr();

    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(()=>{});
      });
    }

    // Destino inicial: respeita atalho PWA (?pg=...) mas nunca no carregamento normal
    const urlParams = new URLSearchParams(window.location.search);
    const pgParam = urlParams.get('pg');
    const paginaInicial = (pgParam && NAV_ITEMS.some(n => n.id === pgParam)) ? pgParam : 'home';

    // Garante que o #sApp existe antes de rodar o splash
    const sAppEl = document.getElementById('sApp');
    if (!sAppEl) { console.error('Ceará: #sApp não encontrado'); return; }

    // Mostra splash, depois monta o app
    showSplash(() => {
      paginaAtiva = paginaInicial;
      buildNav();
      renderPage();
      setupPWAButtons();
    });

  } catch(err) {
    // Se houver erro, mostra o app diretamente sem splash
    console.error('Ceará init error:', err);
    const sApp = document.getElementById('sApp');
    if (sApp) sApp.style.display = '';
    try { buildNav(); renderPage(); } catch(e2) { console.error('Ceará render error:', e2); }
  }
}

// Inicia quando o DOM estiver pronto
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
